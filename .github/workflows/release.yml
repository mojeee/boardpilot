name: Release apps

# Push a tag like v0.3.0 to build the macOS .dmg files and the Windows installer, then publish them
# as one GitHub Release. The website download buttons point to releases/latest/download/<file>.

on:
  push:
    tags: ['v*']
  # Or run it by hand with a version (e.g. 0.6.0): the release creates the tag v<version> on the
  # commit it was run from.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.6.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # This runner is Apple Silicon and builds both apps, but npm only installs the offline model
      # engine for the runner's own architecture: add the Intel one for the x64 app.
      - name: Add the Intel engine for the offline model
        run: npm install --no-save --force --os=darwin --cpu=x64 "@node-llama-cpp/mac-x64@$(node -p "require('node-llama-cpp/package.json').version")"
      - run: npm test
      - run: npx electron-vite build
      - name: Package macOS (unsigned)
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/BoardPilot-mac-arm64.dmg
            dist/BoardPilot-mac-x64.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - name: Package Windows (unsigned)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/BoardPilot-win-x64.exe

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('BoardPilot {0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/BoardPilot-mac-arm64.dmg
            dist/BoardPilot-mac-x64.dmg
            dist/BoardPilot-win-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
